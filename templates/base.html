<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Course Recommender{% endblock %}</title>
    <style>
        body { font-family: Arial; margin: 0; padding: 0; }
        nav { background-color: #222; padding: 10px; }
        nav a { color: white; margin: 0 10px; text-decoration: none; }
        nav .right { float: right; }
    </style>
</head>
<body>
    <nav>
        {% if session.get('user_uni') %}
            <a href="/dashboard">Dashboard</a>
            <a href="{{ url_for('profile') }}">{{ demo_users[session['user_uni']]['name'].split(' ')[0] }}'s Profile</a>
            <a href="/recommendations">Recommendations</a>
            <a href="/courses">All Courses</a>
            <a href="/plan">My Plan</a>
            <a href="/logout" class="right">Logout</a>
        {% else %}
            <a href="/login">Login</a>
            <a href="/register">Register</a>
        {% endif %}
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
