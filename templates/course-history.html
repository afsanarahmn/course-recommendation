{% extends "base.html" %}
{% block title %}Course History{% endblock %}

{% block content %}
<h2>Your Completed Coursework</h2>

{% for semester in history %}
<details {% if loop.first %}open{% endif %}>
    <summary><strong>{{ semester.label }}</strong></summary>
    <ul>
        {% for course in semester.courses %}
        <li>{{ course }}</li>
        {% endfor %}
    </ul>
</details>
<br>
{% endfor %}
{% endblock %}
