{% extends "base.html" %}
{% block title %}Profile{% endblock %}
{% block content %}

<h2>Profile</h2>

<form method="POST" id="profile-form">
    <img src="{{ url_for('static', filename=user.photo) }}" alt="Profile Photo" width="100" style="display:block; margin-bottom:10px;">

    <label>Name:</label>
    <input type="text" name="name" value="{{ user.name }}" disabled><br>

    <label>UNI:</label>
    <input type="text" name="uni" value="{{ user.uni }}" disabled><br>

    <label>Major:</label>
    <select name="major" disabled>
        {% for option in ["Financial Engineering", "Industrial Engineering", "Operations Research", "Computer Science", "Economics"] %}
            <option value="{{ option }}" {% if user.major == option %}selected{% endif %}>{{ option }}</option>
        {% endfor %}
    </select><br>

    <label>CSA Advisor Name:</label>
    <input type="text" name="csa_name" value="{{ user.csa_name or '' }}" disabled><br>

    <label>CSA Advisor Email:</label>
    <input type="email" name="csa_email" value="{{ user.csa_email or '' }}" disabled><br>

    <label>Major Advisor Name:</label>
    <input type="text" name="major_advisor" value="{{ user.major_advisor or '' }}" disabled><br>

    <label>Major Advisor Email:</label>
    <input type="email" name="major_email" value="{{ user.major_email or '' }}" disabled><br>

    <p style="font-size: 0.9em; color: gray;">Reach out to advisor to change name and UNI</p>

    <p>
        <a href="{{ url_for('course_history') }}">View Coursework</a>
    </p>

    <button type="button" id="edit-btn" onclick="enableEditing()">Edit</button>
    <button type="submit" id="save-btn" style="display:none;">Save</button>
</form>

<script>
    function enableEditing() {
        const form = document.getElementById('profile-form');
        for (const input of form.querySelectorAll('input, select')) {
            if (input.name !== "name" && input.name !== "uni") {
                input.disabled = false;
            }
        }
        document.getElementById('edit-btn').style.display = 'none';
        document.getElementById('save-btn').style.display = 'inline';
    }
</script>

{% endblock %}
